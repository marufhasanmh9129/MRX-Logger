plugins { id 'java' }
group = 'com.mrx'
version = '1.0.0'

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral(); maven { url = 'https://repo.papermc.io/repository/maven-public/' } }
dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    implementation('net.dv8tion:JDA:5.2.2') { exclude module: 'opus-java' }
}

jar {
    archiveFileName = 'MRX-Logger.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    manifest { attributes('Implementation-Title': 'MRX-Logger', 'Implementation-Version': project.version) }
}
