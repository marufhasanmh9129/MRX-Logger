  miscellaneous:
    enabled: true
    channel-id: ""

# General settings
settings:
  timestamp-format: "yyyy-MM-dd HH:mm:ss"
  use-embeds: false

  player-movement:
    enabled: true
    interval-seconds: 5

  entity-movement:
    enabled: true
    interval-seconds: 5


# Hidden commands are excluded from MRX-Logger's Discord activity and console logs.
# Add command labels without "/" (examples: "login", "register", "changepassword").
# Bukkit cannot universally suppress messages shown directly to players by other plugins.
blacklist-commands:
  enabled: true

# Hidden command labels (root command is checked; arguments are ignored).
hide-commands:
  - ""
