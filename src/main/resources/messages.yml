# Customize templates here. Common placeholders: {time}, {player}, {world}, {location}, {x}, {y}, {z}, {coordinates}.
# Event-specific placeholders include {block}, {item}, {amount}, {message}, {command}, {entity}, {victim}, {damage}, {target}, {advancement}.
# Common location placeholders are populated for player events and block events. Unknown/unavailable placeholders are removed automatically.
messages:
  player-join: "[{time}] 📥 **Player Joined** - {player} joined the server in {world} at {location}"
  player-leave: "[{time}] 📤 **Player Left** - {player} left the server from {world} at {location}"
  player-death: "[{time}] 💀 **Player Died** - {player} died"
  player-respawn: "[{time}] ❤️ **Player Respawned** - {player} respawned"
  player-chat: "[{time}] 💬 **Chat** - {player}: {message}"
  player-command: "[{time}] ⌨️ **Command** - {player} executed /{command}"
  block-place: "[{time}] 🧱 **Block Placed** - {player} placed {block} at {location}"
  block-break: "[{time}] ⛏️ **Block Broken** - {player} broke {block} at {location}"
  item-drop: "[{time}] ⬇️ **Item Dropped** - {player} dropped {item} x{amount}"
  item-pickup: "[{time}] ⬆️ **Item Picked Up** - {player} picked up {item} x{amount}"
  food-eat: "[{time}] 🍖 **Food Eaten** - {player} ate {item}"
  damage: "[{time}] ⚔️ **Damage** - {victim} took {damage} damage"
  healing: "[{time}] ❤️ **Healing** - {player} recovered {amount} health"
  mob-spawn: "[{time}] 🐾 **Entity Spawned** - {entity} spawned in {world}"
  mob-death: "[{time}] 👻 **Entity Died** - {entity} died in {world}"
  experience-gained: "[{time}] ✨ **EXP Gained** - {player} gained {amount} experience"
  inventory-change: "[{time}] 🎒 **Inventory Changed** - {player} changed inventory"
  interaction: "[{time}] 🖐️ **Interaction** - {player} interacted with {target}"
  advancement: "[{time}] 🏆 **Advancement** - {player} earned {advancement}"
  reload-success: "§a[MRX-Logger] Configuration reloaded successfully."
  reload-failed: "§c[MRX-Logger] Reload failed. Check the server console."
